<!DOCTYPE html>
<html>
<head>
    <title>Wireless Headphones</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f5f5;
        }
        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        img {
            width: 100%;
            border-radius: 10px;
        }
        h1 {
            font-size: 22px;
        }
        .price {
            font-size: 28px;
            font-weight: bold;
            color: #2ecc71;
            margin: 15px 0;
        }
        button {
            width: 48%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .buy {
            background: #2ecc71;
            color: white;
        }
        .cart {
            background: #3498db;
            color: white;
        }
        .btns {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://images.unsplash.com/photo-1518444065439-e933c06ce9cd" />

    <h1>Noise Cancelling Wireless Headphones</h1>
    <p>Premium sound quality with 30 hours battery life.</p>

    <!-- UPDATED Class Name -->
    <div class="price-of-this-product">500 $</div>

    <div class="btns">
        <button class="buy">Buy Now</button>
        <button class="cart">Add to Cart</button>
    </div>
</div>

</body>
</html>
